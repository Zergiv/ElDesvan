appId: 'eldesvan'
productName: 'ElDesvan'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 El Desván'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Zergiv'
  vendor: 'ElDesvan'
  synopsis: 'Launcher de El Desván'
  description: 'Launcher personalizado para unirse al servidor de El Desván. Mods, configuraciones y actualizaciones se gestionan automáticamente.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
